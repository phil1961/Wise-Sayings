<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sayings sphere</title>
<!-- Drawing approach follows the Network Meaning sphere (D:\Projects\network-meaning\public\sphere.html):
     Three.js r128, a world group turned by dragging, instanced marbles for the frequency-10 lattice,
     HTML labels projected each frame and dimmed on the far side, the same palette.
     One page shows one or more "views" (layouts of the same sayings) side by side, turning together.
     Every drawn element carries a layer key; the Controls panel turns layers on and off, dims or
     brightens them and recolours them, and applyLook() is the one place that applies those settings. -->
<style>
  :root {
    --ground: #0e1116; --panel: #161b22e8; --line: #2a313b; --ink: #e6e1d6; --dim: #8b919a;
    --env: #5fc4b8; --mind: #e59a7a; --moral: #e8c35c; --said: #9db7e8; --load: #ff7a59; --bond: #b9a3f0;
    --hidden: #ffd36b; --mistag: #c58cff;
    --body: system-ui, -apple-system, "Segoe UI", sans-serif; --display: Georgia, "Times New Roman", serif;
  }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); font: 14px/1.45 var(--body); overflow: hidden; }
  #views { position: fixed; inset: 0; display: flex; }
  .view { position: relative; flex: 1; border-left: 1px solid var(--line); }
  .view:first-child { border-left: 0; }
  .view canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  .view canvas.drag { cursor: grabbing; }
  .view .labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .view .title { position: absolute; bottom: 34px; left: 0; right: 0; text-align: center; font: italic 16px var(--display); color: var(--dim); pointer-events: none; }
  .lbl { position: absolute; transform: translate(-50%, -150%); font: 11px var(--body); white-space: nowrap; color: var(--ink);
         text-shadow: 0 0 4px var(--ground), 0 0 2px var(--ground); max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  .lbl.sel { font-weight: 600; color: #fff; }
  .lbl.center { font: italic 15px var(--display); color: #fff; max-width: 320px; transform: translate(-50%, -160%); }
  .lbl.axis { font: 600 12px var(--body); text-transform: uppercase; letter-spacing: .05em; transform: translate(-50%, -50%); }
  .lbl.axis.anti { font-style: italic; font-weight: 500; }
  /* hover popup: the full saying, riding just above its (shortened) label as the globe turns */
  .tip { position: absolute; left: 0; top: 0; pointer-events: none; max-width: 320px; padding: 7px 10px; border-radius: 6px;
         background: var(--panel); border: 1px solid var(--line); color: var(--ink); font: italic 14px/1.35 var(--display);
         box-shadow: 0 2px 10px #0008; z-index: 2; }
  .tip[hidden] { display: none; }
  .tip .who { display: block; margin-top: 3px; font: 11px var(--body); color: var(--dim); }
  #info .lean { font-size: 12px; margin-top: 6px; }
  #info .lean b { font-weight: 600; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  #head { top: 12px; left: 12px; max-width: 360px; }
  #head h1 { font: italic 20px var(--display); margin: 0 0 4px; }
  #head .meta { color: var(--dim); font-size: 12px; }
  #legend { margin-top: 8px; font-size: 12px; color: var(--dim); }
  #legend .lg { cursor: pointer; white-space: nowrap; user-select: none; }
  #legend .lg.off { opacity: .35; text-decoration: line-through; }
  #legend span.sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin: 0 4px 0 10px; }
  #legend .lg:first-child span.sw { margin-left: 0; }
  #legend .ln { display: inline-block; width: 16px; height: 0; border-top: 2px solid; margin: 0 4px 3px 10px; vertical-align: middle; }
  #info { top: 12px; right: 12px; width: 360px; max-height: calc(100% - 60px); overflow: auto; }
  #info[hidden] { display: none; }
  #info h2 { font: italic 18px var(--display); margin: 0 0 6px; line-height: 1.3; }
  #info .who { color: var(--dim); font-size: 12px; margin-bottom: 8px; }
  #info .lens { margin: 8px 0; }
  #info .tags { color: var(--dim); font-size: 12px; }
  #info .rel { color: var(--ink); font-size: 12px; margin-top: 6px; }
  #info h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 12px 0 4px; }
  #info ul { margin: 0; padding-left: 18px; }
  #info li { margin: 2px 0; cursor: pointer; }
  #info li:hover { color: #fff; }
  #info .counter { color: var(--load); }
  #info .hidden { color: var(--hidden); }
  #info .mistag { color: var(--mistag); }
  #hint { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); color: var(--dim); font-size: 12px; white-space: nowrap; }
  /* pages menu: every sayings page links to every other, from the shared list in sayings-nav.js */
  #nav { top: 12px; left: 50%; transform: translateX(-50%); padding: 4px; display: flex; gap: 4px; z-index: 5; }
  #nav button, #nav a.btn { background: none; border: 0; color: var(--ink); font: 13px var(--body); padding: 5px 10px; border-radius: 5px; cursor: pointer; text-decoration: none; }
  #nav button:hover, #nav a.btn:hover { background: #ffffff14; color: #fff; }
  #nav button:disabled { color: var(--dim); opacity: .4; cursor: default; background: none; }
  #navMenu { top: 52px; left: 50%; transform: translateX(-50%); width: 460px; max-height: calc(100% - 120px); overflow: auto; z-index: 6; padding: 10px 6px; }
  #navMenu[hidden] { display: none; }
  #navMenu h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 10px 10px 4px; }
  #navMenu h3:first-child { margin-top: 2px; }
  #navMenu a { display: block; padding: 5px 10px; border-radius: 5px; color: var(--ink); text-decoration: none; font-size: 13px; }
  #navMenu a:hover { background: #ffffff14; color: #fff; }
  #navMenu a.here { color: #fff; background: #9db7e826; font-weight: 600; }
  #navMenu a.here::after { content: "  · you are here"; color: var(--dim); font-weight: 400; }
  #navMenu .all { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; color: var(--said); }
  /* controls */
  #ctlBtn { bottom: 12px; left: 12px; padding: 6px 12px; color: var(--ink); font: 13px var(--body); cursor: pointer; }
  #ctlBtn:hover { color: #fff; }
  #ctl { bottom: 52px; left: 12px; width: 340px; max-height: calc(100% - 220px); overflow: auto; font-size: 12px; box-sizing: border-box; }
  /* window blinds: the whole panel rolls up to its top edge when closed, and each section folds shut under its heading */
  #ctl { clip-path: inset(0 0 0 0); transition: clip-path .35s ease, visibility 0s linear 0s; }
  #ctl.rolled { clip-path: inset(0 0 100% 0); visibility: hidden; pointer-events: none; transition: clip-path .35s ease, visibility 0s linear .35s; }
  #ctl h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0; padding: 7px 0 5px;
            cursor: pointer; user-select: none; display: flex; align-items: center; gap: 6px; border-top: 1px solid var(--line); }
  #ctl .sec:first-child h3 { border-top: 0; padding-top: 0; }
  #ctl h3:hover, #ctl h3:focus-visible { color: var(--ink); outline: none; }
  #ctl h3 .chev { display: inline-block; width: 12px; font-size: 14px; line-height: 1; text-align: center; transition: transform .3s ease; }
  #ctl .sec.shut h3 .chev { transform: rotate(-90deg); }
  #ctl .slats { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .3s ease; }
  #ctl .sec.shut .slats { grid-template-rows: 0fr; }
  #ctl .slats > .inner { overflow: hidden; min-height: 0; padding-bottom: 6px; transition: opacity .3s ease; }
  #ctl .sec.shut .slats > .inner { opacity: 0; padding-bottom: 0; }
  @media (prefers-reduced-motion: reduce) { #ctl, #ctl.rolled, #ctl .slats, #ctl .slats > .inner, #ctl h3 .chev { transition: none; } }
  #ctl .row { display: grid; grid-template-columns: 1fr 26px 92px 38px; align-items: center; gap: 6px; margin: 3px 0; }
  #ctl .row label { display: flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ctl .row.off label { color: var(--dim); }
  #ctl .frow { display: grid; grid-template-columns: 1fr 120px 38px; align-items: center; gap: 6px; margin: 4px 0; }
  #ctl .val { color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
  #ctl input[type=range] { width: 100%; margin: 0; }
  #ctl input[type=color] { width: 24px; height: 18px; padding: 0; border: 1px solid var(--line); background: none; cursor: pointer; }
  #ctl select { background: #0e1116; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; font: 12px var(--body); }
  #ctl .chk { display: flex; align-items: center; gap: 6px; margin: 4px 0; cursor: pointer; }
  #ctl .presets { display: flex; flex-wrap: wrap; gap: 4px; }
  #ctl button { background: #0e1116; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; font: 12px var(--body); cursor: pointer; }
  #ctl button:hover { border-color: var(--dim); color: #fff; }
  #ctl .note { color: var(--dim); margin-top: 8px; }
</style>
</head>
<body>
<div id="views"></div>
<div class="panel" id="head">
  <h1 id="h1">Sayings sphere</h1>
  <div class="meta" id="meta"></div>
  <div id="legend"></div>
</div>
<div class="panel" id="info" hidden></div>
<button class="panel" id="ctlBtn" title="Controls (C)">◐ Controls</button>
<div class="panel" id="ctl"></div>
<div id="hint">drag turns · wheel zooms · click a saying</div>
<nav class="panel" id="nav" aria-label="Sayings pages">
  <button id="navPrev" title="Previous page ( [ )">‹</button>
  <button id="navBtn" aria-expanded="false">☰ Pages</button>
  <button id="navNext" title="Next page ( ] )">›</button>
</nav>
<div class="panel" id="navMenu" hidden></div>
<script src="sayings-nav.js"></script>
<script>/*__THREE__*/</script>
<script>
const DATA = /*__DATA__*/;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL = { ink: css("--ink"), dim: "#4a515b", ground: css("--ground"), load: css("--load"), hidden: css("--hidden"), mistag: css("--mistag"),
  situation: "#ffffff", globe: "#475147",   /* rgb(71, 81, 71), a grey-green (Phil, 2026-10-29) */
  apophthegm: css("--env"), aphorism: css("--said"), maxim: css("--moral"), proverb: css("--mind"), epigram: css("--bond") };
const R = 10, $ = id => document.getElementById(id), V = (x, y, z) => new THREE.Vector3(x, y, z);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const byId = {}; DATA.sayings.forEach(s => byId[s.id] = s);
const HL = DATA.highlights || { hidden: [], mistag: [] };
const relOf = id => DATA.center ? (DATA.center.relevance[String(id)] || 0) : null;
const forms = ["apophthegm", "aphorism", "maxim", "proverb", "epigram"].filter(f => DATA.sayings.some(s => s.form === f));

/* ---------- the layers: every kind of thing the page draws ---------- */
const LAYERS = [];
const addLayer = (key, label, group, color) => LAYERS.push({ key, label, group, color });
addLayer("globe", "Globe shell", "Structure", COL.globe);
addLayer("lattice", "Lattice marbles (1,002)", "Structure", COL.dim);
addLayer("mesh", "Triangle mesh", "Structure", COL.ink);
if (DATA.center) addLayer("rings", "Distance rings", "Structure", COL.situation);
for (const f of forms) addLayer("form:" + f, f[0].toUpperCase() + f.slice(1) + "s", "Sayings", COL[f]);
addLayer("labels", "Labels", "Sayings", COL.ink);
if (DATA.counters.length) addLayer("counters", "Counter-saying chords", "Relations", COL.load);
if (HL.hidden.length) addLayer("hidden", "Hidden connections", "Relations", COL.hidden);
if (HL.mistag.length) addLayer("mistag", "Possible mis-tags", "Relations", COL.mistag);
if (DATA.center) { addLayer("situation", "Situation marker", "Situation", COL.situation); addLayer("situationLabel", "Situation label", "Situation", COL.situation); }
/* meaning axes: rods through the centre, thesis at one end and antithesis at the other */
const AXES = DATA.axes || [];
/* one colour and one shape for every axis, so the poles never look like sayings (Phil, 2026-10-29) */
const AXIS_COLOR = "#8b6a47";        /* twig brown, for the rods and pole cylinders (Phil, 2026-10-29) */
const AXIS_LABEL_COLOR = "#c8a77c";  /* a lighter tan of the same brown, so the pole names stay readable */
AXES.forEach(a => { a.color = AXIS_LABEL_COLOR; a.scores = a.scores || {}; });
if (AXES.length) { addLayer("axes", "Meaning axes (rods and poles)", "Meaning axes", AXIS_COLOR); addLayer("axisLabels", "Axis labels", "Meaning axes", AXIS_LABEL_COLOR); }
const leanOf = (id, a) => a.scores[String(id)] || 0;
const isPole = id => typeof id === "string" && id.startsWith("axis:");
const poleParts = id => { const [, key, side] = id.split(":"); return { a: AXES.find(x => x.key === key), side: side === "+" ? 1 : -1 }; };
const poleName = id => { const { a, side } = poleParts(id); return side > 0 ? a.thesis : a.antithesis; };
const layerOf = k => LAYERS.find(l => l.key === k);

/* ---------- the look: settings, defaults, presets, persistence ---------- */
/* surface: the globe's opacity, 0 (clear glass) to 1 (solid: hides the far side and whatever is inside). */
const FILTER_DEFAULTS = { edgeMin: 0, relMin: 0, pulledIn: true, labelMode: "all", dotScale: 1, focus: true, spin: !reduce, bg: COL.ground,
  surface: 0.96, lastSeeThrough: 0.96 };
const SOLID = 0.995;
/* Pages open on a nearly solid (96%) globe with the sayings, their labels, the triangle mesh, the situation
   and the meaning axes showing; the lattice, rings and the chords through the inside start off (Phil, 2026-10-29). */
const OFF_BY_DEFAULT = ["lattice", "rings", "counters", "hidden", "mistag"];
const defaultLook = () => ({ layers: Object.fromEntries(LAYERS.map(l => [l.key, { on: !OFF_BY_DEFAULT.includes(l.key), gain: 1, color: null }])), ...FILTER_DEFAULTS });
const ALL_ON = Object.fromEntries(OFF_BY_DEFAULT.map(k => [k, { on: true }]));
const PRESETS = {
  "Default": {},
  "Everything": { surface: 0.55, layers: ALL_ON },
  "Sayings": { surface: 0.55, layers: { globe: { gain: 0.6 }, mesh: { on: true, gain: 0.5 }, rings: { on: true, gain: 0.6 } } },
  "Tensions": { surface: 0.3, layers: { counters: { on: true, gain: 2 }, hidden: { on: true, gain: 1.6 }, mistag: { on: true, gain: 1.6 } } },
  "Structure": { surface: 0.55, layers: { mesh: { on: true, gain: 1.8 }, lattice: { on: true, gain: 1.6 }, labels: { on: false } } },
  "Clean": { surface: 0.55, layers: { mesh: { on: true, gain: 0.4 } }, labelMode: "front" },
  "Solid": { surface: 1, layers: { mesh: { on: true, gain: 1.3 } } },
  "Glass": { surface: 0.12, layers: { ...ALL_ON, lattice: { on: true, gain: 0.6 } } },
};
/* v3: the defaults changed, so looks saved under the old defaults are not carried over */
const STORE = "sayings-sphere-look-v3";
function withOverrides(base, over) {
  const out = { ...base, layers: { ...base.layers } };
  for (const [k, v] of Object.entries(over || {})) {
    if (k === "layers") { for (const [lk, lv] of Object.entries(v)) if (out.layers[lk]) out.layers[lk] = { ...out.layers[lk], ...lv }; }
    else if (k in FILTER_DEFAULTS) out[k] = v;
  }
  return out;
}
let look = defaultLook();
try { look = withOverrides(look, JSON.parse(localStorage.getItem(STORE) || "{}")); } catch (e) { /* a bad saved look is ignored */ }
/* Thresholds depend on each page's data, so they are not carried to other pages; the rest is. */
const PER_PAGE = ["edgeMin", "relMin", "pulledIn"];
const saveLook = () => {
  const keep = { ...look }; PER_PAGE.forEach(k => delete keep[k]);
  try { localStorage.setItem(STORE, JSON.stringify(keep)); } catch (e) { /* storage off: fine */ }
};

/* ---------- head panel and clickable legend ---------- */
$("h1").textContent = DATA.title;
$("meta").textContent = DATA.subtitle;
function renderLegend() {
  const ln = (key, color, dashed, text) => layerOf(key) ? `<span class="lg${look.layers[key].on ? "" : " off"}" data-k="${key}"><span class="ln" style="border-color:${look.layers[key].color || color}${dashed ? ";border-top-style:dashed" : ""}"></span>${text}</span>` : "";
  $("legend").innerHTML = forms.map(f => `<span class="lg${look.layers["form:" + f].on ? "" : " off"}" data-k="form:${f}"><span class="sw" style="background:${look.layers["form:" + f].color || COL[f]}"></span>${f}</span>`).join("") + "<br>" +
    ln("counters", COL.load, true, "counter-sayings") + ln("hidden", COL.hidden, false, "hidden connection") + ln("mistag", COL.mistag, false, "possible mis-tag");
  $("legend").querySelectorAll(".lg").forEach(el => el.onclick = () => { const L = look.layers[el.dataset.k]; L.on = !L.on; applyLook(); });
}

/* ---------- drawing ---------- */
const shared = { q: new THREE.Quaternion(), camDist: 30, spin: look.spin, targetQ: null, selected: null };
const views = [];
const arc = (a, b, lift) => { /* great-circle arc by spherical interpolation */
  const u = a.clone().normalize(), w = b.clone().normalize(), om = Math.acos(Math.min(1, Math.max(-1, u.dot(w)))), s = Math.sin(om), pts = [];
  const n = Math.max(8, Math.ceil(om / 0.05));
  for (let i = 0; i <= n; i++) {
    const t = i / n, p = s < 1e-6 ? u.clone() : u.clone().multiplyScalar(Math.sin((1 - t) * om) / s).add(w.clone().multiplyScalar(Math.sin(t * om) / s));
    pts.push(p.multiplyScalar(R * lift));
  }
  return pts;
};
/* labels are short; hovering a saying shows the whole text in a popup (see renderTip) */
const short = t => t.length > 32 ? t.slice(0, 30).replace(/\s+\S*$/, "") + "…" : t;
/* tag a drawn object with its layer, its own base opacity and colour, and the sayings it depends on */
const tag = (obj, layer, base, color, extra) => { obj.userData = { ...obj.userData, layer, base, color, ...extra }; obj.material.transparent = true; return obj; };

function makeView(spec) {
  const el = document.createElement("div"); el.className = "view";
  el.innerHTML = `<canvas></canvas><div class="labels"></div><div class="tip" hidden></div>` + (DATA.views.length > 1 ? `<div class="title">${esc(spec.title)}</div>` : "");
  $("views").appendChild(el);
  const canvas = el.querySelector("canvas"), labelsEl = el.querySelector(".labels");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200), world = new THREE.Group();
  scene.add(world);
  /* globe (depthWrite off: dims what is behind it but never hides lines inside it) and its 1,002 marbles */
  const globe = tag(new THREE.Mesh(new THREE.SphereGeometry(R * 0.985, 48, 32), new THREE.MeshBasicMaterial({ depthWrite: false })), "globe", 0.55, COL.globe);
  world.add(globe);
  {
    const mesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.06, 6, 4), new THREE.MeshBasicMaterial(), DATA.lattice.length), m4 = new THREE.Matrix4();
    DATA.lattice.forEach(([x, y, z], i) => { m4.makeTranslation(x * R, y * R, z * R); mesh.setMatrixAt(i, m4); });
    world.add(tag(mesh, "lattice", 0.5, COL.dim));
  }
  const pos = {}, dots = [];
  for (const p of spec.points) {
    const v = (p.vertex != null ? V(...DATA.lattice[p.vertex]) : V(p.x, p.y, p.z)).normalize().multiplyScalar(R);
    pos[p.saying_id] = v;
    /* a saying's ball: a third of its former size (Phil, 2026-10-29), still a little bigger for higher impact.
       An invisible sphere at the old size rides along as its click target, so small balls stay easy to click. */
    const s = byId[p.saying_id], reach = 0.22 + 0.03 * s.impact_score, size = reach / 3;
    const dot = new THREE.Mesh(new THREE.SphereGeometry(size, 16, 12), new THREE.MeshBasicMaterial());
    dot.position.copy(v.clone().multiplyScalar(1 + size / R));
    world.add(tag(dot, "form:" + s.form, 1, COL[s.form] || COL.ink, { id: s.id, ids: [s.id], dot: true }));
    const hit = new THREE.Mesh(new THREE.SphereGeometry(reach, 8, 6), new THREE.MeshBasicMaterial({ visible: false }));
    hit.userData = { id: s.id };
    dot.add(hit); dot.userData.hit = hit; dots.push(dot);
  }
  /* a consult sphere: the situation is a fixed marker; faint rings mark 30, 60 and 90 degrees from it */
  if (DATA.center) {
    const c = V(...DATA.center.pos).normalize();
    pos[0] = c.clone().multiplyScalar(R);
    /* a third of its former size, to match the sayings (Phil, 2026-10-29); the old size stays as its click target */
    const MARK = 0.25;
    const marker = new THREE.Mesh(new THREE.OctahedronGeometry(MARK), new THREE.MeshBasicMaterial());
    marker.position.copy(c.clone().multiplyScalar(R + MARK));
    world.add(tag(marker, "situation", 1, COL.situation, { id: 0, ids: [0], dot: true }));
    const markHit = new THREE.Mesh(new THREE.SphereGeometry(0.75, 8, 6), new THREE.MeshBasicMaterial({ visible: false }));
    markHit.userData = { id: 0 };
    marker.add(markHit); marker.userData.hit = markHit; dots.push(marker);
    const halo = new THREE.Mesh(new THREE.TorusGeometry(MARK * 1.55, 0.02, 8, 48), new THREE.MeshBasicMaterial());
    halo.position.copy(marker.position); halo.lookAt(c.clone().multiplyScalar(2 * R));
    world.add(tag(halo, "situation", 0.6, COL.situation, { ids: [0] }));
    const u = Math.abs(c.x) < 0.9 ? V(1, 0, 0) : V(0, 0, 1), e1 = u.sub(c.clone().multiplyScalar(u.dot(c))).normalize(), e2 = c.clone().cross(e1);
    for (const deg of [30, 60, 90]) {
      const a = deg * Math.PI / 180, pts = [];
      for (let i = 0; i <= 96; i++) { const t = i / 96 * Math.PI * 2; pts.push(c.clone().multiplyScalar(Math.cos(a)).add(e1.clone().multiplyScalar(Math.sin(a) * Math.cos(t))).add(e2.clone().multiplyScalar(Math.sin(a) * Math.sin(t))).multiplyScalar(R * 1.002)); }
      const ring = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineDashedMaterial({ dashSize: 0.25, gapSize: 0.35 }));
      ring.computeLineDistances(); world.add(tag(ring, "rings", 0.35, COL.situation));
    }
  }
  /* meaning axes: a thin rod through the centre per axis; at each end a solid cylinder stands out of the surface
     along the rod, to 20% of the radius above it (about two inches on a 20-inch globe). Every pole has the same shape and
     colour (thesis and antithesis differ only in their label), and none can be mistaken for a saying's ball. */
  const POLE_H = R * 0.2, POLE_R = 0.15;   /* 20% of the radius: about two inches on a 20-inch globe */
  for (const a of AXES) {
    const d = V(...a.dir).normalize();
    const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, R * 2, 8), new THREE.MeshBasicMaterial());
    rod.quaternion.setFromUnitVectors(V(0, 1, 0), d);
    world.add(tag(rod, "axes", 0.75, AXIS_COLOR));
    for (const side of [1, -1]) {
      const id = `axis:${a.key}:${side > 0 ? "+" : "-"}`, out = d.clone().multiplyScalar(side);
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(POLE_R, POLE_R, POLE_H, 20), new THREE.MeshBasicMaterial());
      pole.quaternion.setFromUnitVectors(V(0, 1, 0), out);
      pole.position.copy(out.clone().multiplyScalar(R + POLE_H / 2));
      /* dark rims, so a pole seen end-on still reads as a cylinder, not as a saying's disc */
      const rims = new THREE.LineSegments(new THREE.EdgesGeometry(pole.geometry, 30), new THREE.LineBasicMaterial());
      pole.add(tag(rims, "axes", 1, "#4a3523"));   /* darker bark at the rims */
      world.add(tag(pole, "axes", 1, AXIS_COLOR, { id, pole: true })); dots.push(pole);
      pos[id] = out.clone().multiplyScalar(R + POLE_H);
    }
  }
  /* triangulation edges: great-circle arcs, brighter with relatedness */
  for (const [a, b, r] of spec.edges) {
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(arc(pos[a], pos[b], 1.004)), new THREE.LineBasicMaterial());
    world.add(tag(line, "mesh", 0.12 + 0.6 * (r || 0), COL.ink, { ids: [a, b], r: r || 0, link: true }));
  }
  /* counter-sayings: dashed chord through the globe */
  for (const [a, b] of DATA.counters) {
    if (!pos[a] || !pos[b]) continue;
    const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints([pos[a], pos[b]]), new THREE.LineDashedMaterial({ dashSize: 0.4, gapSize: 0.3 }));
    l.computeLineDistances(); world.add(tag(l, "counters", 0.7, COL.load, { ids: [a, b], link: true }));
  }
  /* comparison highlights: arcs lifted a little higher so they read above the mesh */
  for (const [kind, list] of [["hidden", HL.hidden], ["mistag", HL.mistag]]) for (const h of list) {
    if (!pos[h.a] || !pos[h.b]) continue;
    world.add(tag(new THREE.Line(new THREE.BufferGeometry().setFromPoints(arc(pos[h.a], pos[h.b], 1.03)), new THREE.LineBasicMaterial()),
      kind, 0.9, COL[kind], { ids: [h.a, h.b], link: true }));
  }
  const view = { spec, canvas, labelsEl, tipEl: el.querySelector(".tip"), hover: null, renderer, scene, camera, world, pos, dots, globe };
  hookPointer(view);
  views.push(view);
  return view;
}

/* ---------- applying the look ---------- */
function sayingOn(id) {
  if (id === 0) return !!DATA.center && look.layers.situation.on;
  const s = byId[id];
  if (!s || !look.layers["form:" + s.form].on) return false;
  if (DATA.center) return relOf(id) > 0 ? relOf(id) >= look.relMin : look.pulledIn;
  return true;
}
function focusSet() { /* the selected saying and everything linked to it, when focus is on */
  const sel = shared.selected;
  if (sel == null || !look.focus) return null;
  if (isPole(sel)) {
    const { a, side } = poleParts(sel);
    return new Set([sel, ...DATA.sayings.filter(s => leanOf(s.id, a) * side > 0).map(s => s.id)]);
  }
  const set = new Set([sel]);
  const add = (a, b) => { if (a === sel) set.add(b); if (b === sel) set.add(a); };
  for (const v of views) for (const [a, b] of v.spec.edges) add(a, b);
  for (const [a, b] of DATA.counters) add(a, b);
  for (const h of [...HL.hidden, ...HL.mistag]) add(h.a, h.b);
  return set;
}
const WHITE = new THREE.Color("#ffffff");
function shade(hex, gain) { /* above 100% a colour also moves toward white, so "brighter" reads as brighter */
  const c = new THREE.Color(hex);
  return gain > 1 ? c.lerp(WHITE, Math.min(1, (gain - 1) * 0.3)) : c;   /* gently, so a colour keeps its identity */
}
function applyLook() {
  const F = focusSet();
  for (const v of views) {
    v.renderer.setClearColor(look.bg);
    v.world.traverse(o => {
      const u = o.userData;
      if (!u.layer) return;
      const L = look.layers[u.layer];
      let vis = L.on && (!u.ids || u.ids.every(sayingOn));
      if (vis && u.layer === "mesh" && u.r < look.edgeMin) vis = false;
      o.visible = vis;
      if (!vis) return;
      if (u.layer === "globe") {
        /* the surface: its slider is opacity. Solid means really solid: it writes depth, so the far side
           and whatever is inside the globe (counter chords) are hidden, and only the near side shows. */
        const solid = look.surface >= SOLID, m = o.material;
        if (m.transparent === solid || m.depthWrite !== solid) { m.transparent = !solid; m.depthWrite = solid; m.needsUpdate = true; }
        m.opacity = solid ? 1 : look.surface;
        m.color.set(L.color || u.color);
        o.visible = L.on && look.surface > 0.005;
        return;
      }
      let op = u.base * L.gain;
      if (F && u.ids) {
        if (u.link) op = u.ids.includes(shared.selected) ? Math.max(op, 0.95) : op * 0.3;
        else if (!u.ids.every(i => F.has(i))) op *= 0.25;
      }
      o.material.color.copy(shade(L.color || u.color, L.gain));
      o.material.opacity = Math.min(1, op);
      if (u.dot) o.scale.setScalar(u.layer === "situation" ? 1 : look.dotScale);
    });
  }
  document.body.style.background = look.bg;
  shared.spin = look.spin && !shared.dragged;
  renderLegend();
  syncPanel();
  saveLook();
}

/* ---------- labels ---------- */
/* how visible a far-side label is: it fades as the surface gets more opaque, and is gone when solid */
const backFactor = () => look.layers.globe.on ? Math.max(0, 1 - look.surface) * 0.62 : 0.62;
const solidGlobe = () => look.layers.globe.on && look.surface >= SOLID;
function labelStyle(el, key, back, faded) {
  const L = look.layers[key];
  if (L.color) el.style.color = L.color;
  el.style.opacity = String(Math.min(1, L.gain) * (back ? backFactor() : 1) * (faded ? 0.3 : 1));
  if (L.gain > 1.3) el.style.fontWeight = "600";
}
function renderLabels(v) {
  v.labelsEl.textContent = "";
  const w = v.canvas.clientWidth, h = v.canvas.clientHeight, camPos = v.camera.position.clone(), F = focusSet();
  const place = (el, sp) => { el.style.left = ((sp.x + 1) / 2 * w) + "px"; el.style.top = ((1 - sp.y) / 2 * h) + "px"; v.labelsEl.appendChild(el); };
  if (look.layers.labels.on) for (const s of DATA.sayings) {
    if (!v.pos[s.id] || !sayingOn(s.id)) continue;
    const near = !F || F.has(s.id);
    if (look.labelMode === "focus" && (!F || !F.has(s.id))) continue;
    const wp = v.pos[s.id].clone().applyMatrix4(v.world.matrixWorld), sp = wp.clone().project(v.camera);
    if (sp.z > 1 || Math.abs(sp.x) > 1.05 || Math.abs(sp.y) > 1.05) continue;
    const back = wp.distanceTo(camPos) > camPos.length();
    if (back && (solidGlobe() || look.labelMode === "front") && s.id !== shared.selected) continue;
    const el = document.createElement("div");
    el.className = "lbl" + (s.id === shared.selected ? " sel" : "");
    el.textContent = short(s.text);
    labelStyle(el, "labels", back, !near);
    place(el, sp);
  }
  if (AXES.length && look.layers.axes.on && look.layers.axisLabels.on) for (const a of AXES) for (const side of [1, -1]) {
    const id = `axis:${a.key}:${side > 0 ? "+" : "-"}`;
    const wp = v.pos[id].clone().multiplyScalar(1.06).applyMatrix4(v.world.matrixWorld), sp = wp.clone().project(v.camera);
    if (sp.z > 1) continue;
    const back = wp.distanceTo(camPos) > camPos.length();
    if (back && solidGlobe() && shared.selected !== id) continue;
    const el = document.createElement("div");
    el.className = "lbl axis" + (side < 0 ? " anti" : "") + (shared.selected === id ? " sel" : "");
    el.textContent = side > 0 ? a.thesis : a.antithesis;
    el.style.color = look.layers.axisLabels.color || a.color;
    /* the tips stand above the surface, so even a solid globe only half-hides the far ones */
    el.style.opacity = String(Math.min(1, look.layers.axisLabels.gain) * (back ? Math.max(0.18, backFactor()) : 1));
    place(el, sp);
  }
  if (DATA.center && v.pos[0] && look.layers.situationLabel.on && look.layers.situation.on) {
    const wp = v.pos[0].clone().multiplyScalar(1.05).applyMatrix4(v.world.matrixWorld), sp = wp.clone().project(v.camera);
    const behind = wp.distanceTo(camPos) > camPos.length();
    if (sp.z <= 1 && !(behind && solidGlobe())) {
      const el = document.createElement("div");
      el.className = "lbl center";
      el.textContent = short(DATA.center.text);
      labelStyle(el, "situationLabel", behind, false);
      place(el, sp);
    }
  }
}

/* the hover popup: placed every frame, so it rides along with its saying as the globe turns. Behind a
   see-through globe it fades with the globe's opacity; once the globe hides the saying (solid, or nearly),
   it goes away and stays gone until the pointer finds another saying. */
function renderTip(v) {
  const t = v.tipEl, id = v.hover;
  const hide = () => { t.hidden = true; v.hover = null; t.dataset.id = ""; };
  if (id == null || !v.pos[id] || !sayingOn(id)) return hide();
  const camPos = v.camera.position.clone(), wp = v.pos[id].clone().applyMatrix4(v.world.matrixWorld), sp = wp.clone().project(v.camera);
  if (sp.z > 1 || Math.abs(sp.x) > 1.05 || Math.abs(sp.y) > 1.05) return hide();
  const back = wp.distanceTo(camPos) > camPos.length();
  const seen = !back || !look.layers.globe.on ? 1 : solidGlobe() ? 0 : 1 - look.surface;
  if (seen < 0.1) return hide();
  if (t.dataset.id !== String(id)) {   /* fill only when the hovered saying changes */
    const s = id === 0 ? { text: DATA.center.text, who: "your situation" } : byId[id];
    t.innerHTML = `${esc(s.text)}<span class="who">${esc(s.who)}</span>`;
    t.dataset.id = String(id);
  }
  t.hidden = false;
  t.style.opacity = String(seen);
  const w = v.canvas.clientWidth, h = v.canvas.clientHeight, x = (sp.x + 1) / 2 * w, y = (1 - sp.y) / 2 * h;
  const tw = t.offsetWidth, th = t.offsetHeight;
  let top = y - 30 - th;                 /* just above the saying's label */
  if (top < 6) top = y + 14;             /* no room above: hang it below the ball */
  t.style.transform = `translate(${Math.round(Math.min(Math.max(x - tw / 2, 6), w - tw - 6))}px, ${Math.round(Math.min(top, h - th - 6))}px)`;
}

/* ---------- the controls panel ---------- */
const ctl = $("ctl");
const pctTxt = g => Math.round(g * 100) + "%";
/* folded sections, remembered for every sphere page (like the look, but kept apart from it so presets leave them alone) */
const BLINDS = "sayings-sphere-blinds-v1";
const shutSecs = new Set((() => { try { return JSON.parse(localStorage.getItem(BLINDS)) || []; } catch (e) { return []; } })());
const section = (name, body) =>
  `<section class="sec${shutSecs.has(name) ? " shut" : ""}" data-sec="${esc(name)}">` +
  `<h3 role="button" tabindex="0" aria-expanded="${!shutSecs.has(name)}"><span class="chev">▾</span>${esc(name)}</h3>` +
  `<div class="slats"><div class="inner">${body}</div></div></section>`;
function buildPanel() {
  const groups = [];   /* [name, html] in LAYERS order */
  for (const l of LAYERS) {
    if (!groups.length || groups[groups.length - 1][0] !== l.group) groups.push([l.group, ""]);
    /* the globe's slider is opacity (0 = clear glass, 100% = solid); every other slider dims or brightens */
    const slider = l.key === "globe"
      ? `<input type="range" min="0" max="100" step="5" data-f="surface" title="Opacity: 0% clear glass, 100% solid (hides the far side). Key O toggles solid.">`
      : `<input type="range" min="0" max="200" step="5" data-f="gain" title="Dim or brighten">`;
    groups[groups.length - 1][1] += `<div class="row" data-k="${l.key}"><label><input type="checkbox" data-f="on">${esc(l.key === "globe" ? "Globe surface" : l.label)}</label>` +
      `<input type="color" data-f="color" title="Colour (double-click to reset)">${slider}<span class="val"></span></div>`;
    if (l.key === "globe") groups[groups.length - 1][1] += `<div class="note" style="margin:0 0 4px">At 100% the globe is solid: you see only the near side, with nothing behind it showing through (counter chords run inside, so they're hidden too).</div>`;
  }
  let html = groups.map(([name, body]) => section(name, body)).join("");
  html += section("Filters",
    `<div class="frow"><span>Hide mesh links weaker than</span><input type="range" min="0" max="100" step="5" data-g="edgeMin"><span class="val" data-v="edgeMin"></span></div>` +
    (DATA.center ? `<div class="frow"><span>Hide sayings less relevant than</span><input type="range" min="0" max="100" step="5" data-g="relMin"><span class="val" data-v="relMin"></span></div>` +
      `<label class="chk"><input type="checkbox" data-g="pulledIn">Show pulled-in counter-sayings</label>` : "") +
    `<div class="frow"><span>Labels</span><select data-g="labelMode"><option value="all">all</option><option value="front">front side only</option><option value="focus">selected + neighbours</option></select><span></span></div>` +
    `<div class="frow"><span>Saying size</span><input type="range" min="50" max="200" step="10" data-g="dotScale"><span class="val" data-v="dotScale"></span></div>` +
    `<label class="chk"><input type="checkbox" data-g="focus">Fade what isn't linked to the selected saying</label>` +
    `<label class="chk"><input type="checkbox" data-g="spin">Slow spin</label>` +
    `<div class="frow"><span>Background</span><input type="color" data-g="bg"><span></span></div>`);
  html += section("Presets", `<div class="presets">${Object.keys(PRESETS).map(p => `<button data-p="${p}">${p}</button>`).join("")}</div>`);
  html += `<div class="note">Click a heading to fold its section. Settings are remembered for every sphere page. Keys: C controls · L labels · O solid / see-through · P pages · [ ] previous / next page · Esc deselect.</div>`;
  ctl.innerHTML = html;
  ctl.querySelectorAll(".sec > h3").forEach(h => {
    const sec = h.parentElement, flip = () => {
      const shut = sec.classList.toggle("shut");
      h.setAttribute("aria-expanded", String(!shut));
      shut ? shutSecs.add(sec.dataset.sec) : shutSecs.delete(sec.dataset.sec);
      try { localStorage.setItem(BLINDS, JSON.stringify([...shutSecs])); } catch (e) {}
    };
    h.onclick = flip;
    h.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } };
  });
  ctl.querySelectorAll(".row").forEach(row => {
    const L = () => look.layers[row.dataset.k];
    row.querySelector("[data-f=on]").onchange = e => { L().on = e.target.checked; applyLook(); };
    const col = row.querySelector("[data-f=color]");
    col.oninput = e => { L().color = e.target.value; applyLook(); };
    col.ondblclick = e => { e.preventDefault(); L().color = null; applyLook(); };
    const gain = row.querySelector("[data-f=gain]");
    if (gain) gain.oninput = e => { L().gain = +e.target.value / 100; applyLook(); };
    const surf = row.querySelector("[data-f=surface]");
    if (surf) surf.oninput = e => { setSurface(+e.target.value / 100); };
  });
  ctl.querySelectorAll("[data-g]").forEach(inp => {
    const k = inp.dataset.g;
    const read = () => inp.type === "checkbox" ? inp.checked : inp.type === "range" ? +inp.value / 100 : inp.value;
    inp.oninput = inp.onchange = () => { look[k] = read(); if (k === "spin") shared.dragged = false; applyLook(); };
  });
  ctl.querySelectorAll("[data-p]").forEach(b => b.onclick = () => {
    const keepBg = look.bg;
    look = withOverrides(defaultLook(), PRESETS[b.dataset.p]);
    if (b.dataset.p !== "Default") look.bg = keepBg;
    applyLook();
  });
}
function setSurface(v) {
  look.surface = v;

  if (v > 0.005) look.layers.globe.on = true;
  applyLook();
}
function syncPanel() {
  if (!ctl.firstChild) return;
  ctl.querySelectorAll(".row").forEach(row => {
    const L = look.layers[row.dataset.k], l = layerOf(row.dataset.k);
    row.classList.toggle("off", !L.on);
    row.querySelector("[data-f=on]").checked = L.on;
    row.querySelector("[data-f=color]").value = new THREE.Color(L.color || l.color).getHexString().replace(/^/, "#");
    const gain = row.querySelector("[data-f=gain]"), surf = row.querySelector("[data-f=surface]");
    if (gain) { gain.value = Math.round(L.gain * 100); row.querySelector(".val").textContent = pctTxt(L.gain); }
    if (surf) { surf.value = Math.round(look.surface * 100); row.querySelector(".val").textContent = look.surface >= SOLID ? "solid" : pctTxt(look.surface); }
  });
  ctl.querySelectorAll("[data-g]").forEach(inp => {
    const v = look[inp.dataset.g];
    if (inp.type === "checkbox") inp.checked = v;
    else if (inp.type === "range") inp.value = Math.round(v * 100);
    else if (inp.type === "color") inp.value = new THREE.Color(v).getHexString().replace(/^/, "#");
    else inp.value = v;
  });
  ctl.querySelectorAll("[data-v]").forEach(s => s.textContent = pctTxt(look[s.dataset.v]));
}
/* the panel rolls up like a blind (CSS on #ctl.rolled); it starts lowered */
const rollCtl = open => { open = open ?? ctl.classList.contains("rolled"); ctl.classList.toggle("rolled", !open); ctl.setAttribute("aria-hidden", String(!open)); $("ctlBtn").setAttribute("aria-expanded", String(open)); };
$("ctlBtn").onclick = () => rollCtl();

/* ---------- info panel: one neighbour list per view, so a comparison shows both ---------- */
const info = $("info");
const nameOf = id => id === 0 ? "◆ your situation" : isPole(id) ? "⟂ " + poleName(id) : byId[id].text;
const item = (id, cls, extra) => `<li class="${cls || ""}" data-id="${id}">${esc(nameOf(id))}${extra || ""}</li>`;
const pct = r => r ? ` <span class="tags">(${Math.round(r * 100)}%)</span>` : "";
function centerPanel() {
  const C = DATA.center, ranked = DATA.sayings.map(s => s.id).sort((a, b) => relOf(b) - relOf(a));
  return `<h2>${esc(C.text)}</h2><div class="who">your situation · ${DATA.sayings.length} sayings around it</div>` +
    (C.matched.length ? `<div class="tags">matched: ${esc(C.matched.join(", "))}</div>` : "") +
    `<h3>By relevance (closest to the situation)</h3><ul>${ranked.filter(id => relOf(id) > 0).map(id => item(id, "", pct(relOf(id)))).join("")}</ul>` +
    (C.pulled_in.length ? `<h3>Pulled in as counter-sayings</h3><ul>${C.pulled_in.map(id => item(id, "counter")).join("")}</ul>` : "");
}
function polePanel(id) {
  const { a, side } = poleParts(id);
  const name = side > 0 ? a.thesis : a.antithesis, other = side > 0 ? a.antithesis : a.thesis;
  const lean = DATA.sayings.map(s => [s.id, leanOf(s.id, a) * side]).filter(([, s]) => s > 0).sort((x, y) => y[1] - x[1]);
  const against = DATA.sayings.filter(s => leanOf(s.id, a) * side < 0).length;
  return `<h2 style="color:${a.color}">${esc(name)}</h2><div class="who">${side > 0 ? "thesis" : "antithesis"} of a meaning axis · opposite pole: ${esc(other)}</div>` +
    `<h3>Sayings that lean this way (${lean.length})</h3>` +
    (lean.length ? `<ul>${lean.map(([sid, s]) => item(sid, "", ` <span class="tags">(${s === 2 ? "strongly" : "leans"})</span>`)).join("")}</ul>` : "<p class=\"tags\">None in this sample.</p>") +
    `<div class="tags" style="margin-top:8px">${against} saying(s) lean the other way, toward ${esc(other)}.</div>`;
}
function select(id) {
  shared.selected = id;
  applyLook();
  if (id == null) { info.hidden = true; return; }
  let html;
  if (isPole(id)) html = polePanel(id);
  else if (id === 0) html = centerPanel();
  else {
    const s = byId[id];
    html = `<h2>${esc(s.text)}</h2><div class="who">#${s.id} · ${esc(s.who)} · ${s.form} · impact ${s.impact_score}</div>` +
      `<div class="lens">${esc(s.lens)}</div><div class="tags">${esc(s.tags.join(", "))}</div>`;
    const leans = AXES.map(a => [a, leanOf(id, a)]).filter(([, s]) => s);
    if (AXES.length) html += `<div class="lean">` + (leans.length
      ? "Leans: " + leans.map(([a, s]) => `<b style="color:${a.color}">${esc(s > 0 ? a.thesis : a.antithesis)}</b> (${s > 0 ? "+" : ""}${s})`).join(", ")
      : "Not rated toward any axis.") + `</div>`;
    if (DATA.center) html += `<div class="rel">` + (relOf(id) > 0 ? `Relevance to your situation: ${Math.round(relOf(id) * 100)}%`
      : `Not matched to your situation: here because it pulls against one that is.`) + `</div>`;
    for (const v of views) {
      const near = v.spec.edges.filter(([a, b]) => a === id || b === id).map(([a, b, r]) => [a === id ? b : a, r]).sort((x, y) => (y[1] || 0) - (x[1] || 0));
      if (near.length) html += `<h3>Neighbours${views.length > 1 ? " · " + esc(v.spec.title) : ""}</h3><ul>${near.map(([n, r]) => item(n, "", pct(r))).join("")}</ul>`;
    }
    const other = (list, cls, label) => {
      const xs = list.filter(h => h.a === id || h.b === id).map(h => [h.a === id ? h.b : h.a, h]);
      return xs.length ? `<h3>${label}</h3><ul>${xs.map(([n, h]) => item(n, cls, ` <span class="tags">(meaning ${Math.round(h.meaning * 100)}%, tags ${Math.round(h.tags * 100)}%)</span>`)).join("")}</ul>` : "";
    };
    html += other(HL.hidden, "hidden", "Hidden connections") + other(HL.mistag, "mistag", "Possible mis-tags");
    const opp = DATA.counters.filter(([a, b]) => a === id || b === id).map(([a, b]) => a === id ? b : a).filter(x => byId[x]);
    if (opp.length) html += `<h3>Pulls the other way</h3><ul>${opp.map(n => item(n, "counter")).join("")}</ul>`;
  }
  info.innerHTML = html; info.hidden = false;
  info.querySelectorAll("li[data-id]").forEach(li => li.onclick = () => { const n = isPole(li.dataset.id) ? li.dataset.id : +li.dataset.id; select(n); turnTo(n); });
}
function turnTo(id) { /* bring a saying (as placed in the last view) round to face the camera */
  const v = views[views.length - 1];
  shared.targetQ = new THREE.Quaternion().setFromUnitVectors(v.pos[id].clone().normalize(), V(0, 0, 1));
  shared.spin = false; shared.dragged = true;   /* stay put once the reader has picked something */
}

/* ---------- pointer and keys ---------- */
function hookPointer(v) {
  let dragging = false, moved = 0, last = [0, 0];
  const c = v.canvas, ray = new THREE.Raycaster();
  /* what is under the pointer: a saying, the situation (0), a pole id, or null. On a solid globe the
     surface is in the way of anything behind it. */
  const pick = e => {
    const r = c.getBoundingClientRect();
    ray.setFromCamera(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1), v.camera);
    const targets = v.dots.filter(d => d.visible).map(d => d.userData.hit || d).concat(solidGlobe() && v.globe.visible ? [v.globe] : []);
    const hit = ray.intersectObjects(targets)[0];
    return hit && hit.object !== v.globe ? hit.object.userData.id : null;
  };
  c.addEventListener("pointerdown", e => { dragging = true; moved = 0; last = [e.clientX, e.clientY]; c.setPointerCapture(e.pointerId); c.style.cursor = ""; c.classList.add("drag"); });
  c.addEventListener("pointerleave", () => { v.hover = null; });
  c.addEventListener("pointermove", e => {
    if (!dragging) {   /* hovering: a saying (or the situation) gets the full-text popup; poles already show their whole label */
      if (e.pointerType === "touch") return;
      const id = pick(e);
      v.hover = id != null && !isPole(id) ? id : null;
      c.style.cursor = id != null ? "pointer" : "";
      return;
    }
    const dx = e.clientX - last[0], dy = e.clientY - last[1]; last = [e.clientX, e.clientY]; moved += Math.abs(dx) + Math.abs(dy);
    shared.targetQ = null;
    shared.q.premultiply(new THREE.Quaternion().setFromAxisAngle(V(0, 1, 0), dx * 0.008)).premultiply(new THREE.Quaternion().setFromAxisAngle(V(1, 0, 0), dy * 0.008));
    if (moved > 4) { shared.spin = false; shared.dragged = true; }
  });
  c.addEventListener("pointerup", e => {
    dragging = false; c.classList.remove("drag");
    if (moved > 4) return;
    const id = pick(e);
    select(id != null && id === shared.selected ? null : id);   /* clicking the selected one again closes its panel */
  });
  c.addEventListener("wheel", e => { e.preventDefault(); shared.camDist = Math.min(70, Math.max(13, shared.camDist * (1 + Math.sign(e.deltaY) * 0.08))); }, { passive: false });
}
addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input, select, textarea")) return;
  if (e.key === "c" || e.key === "C") rollCtl();
  else if (e.key === "l" || e.key === "L") { look.layers.labels.on = !look.layers.labels.on; applyLook(); }
  else if (e.key === "o" || e.key === "O") setSurface(look.surface >= SOLID ? (look.lastSeeThrough || 0.55) : 1);
  else if (e.key === "Escape") select(null);
});

/* ---------- pages menu ---------- */
/* sayings-nav.js (next to the page) sets window.SAYINGS_PAGES; it is rebuilt whenever pages are published,
   so every page, old or new, lists all the others. Without it the menu offers just the index. */
{
  const here = decodeURIComponent(location.pathname.split("/").pop() || "");
  const list = Array.isArray(window.SAYINGS_PAGES) ? window.SAYINGS_PAGES : [];
  const at = list.findIndex(p => p.file === here);
  const menu = $("navMenu"), btn = $("navBtn"), prev = $("navPrev"), next = $("navNext");
  const go = k => { if (list[k]) location.href = list[k].file; };
  prev.disabled = at <= 0; next.disabled = at < 0 || at >= list.length - 1;
  prev.onclick = () => go(at - 1); next.onclick = () => go(at + 1);
  if (at > 0) prev.title = "Previous ( [ ): " + list[at - 1].title;
  if (at >= 0 && at < list.length - 1) next.title = "Next ( ] ): " + list[at + 1].title;
  let html = "", group = null;
  for (const p of list) {
    if (p.group !== group) { group = p.group; html += `<h3>${esc(group)}</h3>`; }
    html += `<a href="${encodeURI(p.file)}"${p.file === here ? ' class="here" aria-current="page"' : ""}>${esc(p.title)}</a>`;
  }
  menu.innerHTML = (list.length ? html : `<h3>Pages</h3><a>The page list isn't next to this file yet.</a>`) +
    `<a class="all" href="sayings-index.html">All pages, with descriptions →</a>`;
  const show = on => { menu.hidden = !on; btn.setAttribute("aria-expanded", String(on)); };
  btn.onclick = e => { e.stopPropagation(); show(menu.hidden); };
  if (decodeURIComponent(location.hash).includes("pages")) show(true);   /* a link can open it: #pages */
  addEventListener("click", e => { if (!menu.hidden && !menu.contains(e.target)) show(false); });
  addEventListener("keydown", e => {
    if (e.target.closest && e.target.closest("input, select, textarea")) return;
    if (e.key === "[") go(at - 1);
    else if (e.key === "]") go(at + 1);
    else if (e.key === "p" || e.key === "P") show(menu.hidden);
    else if (e.key === "Escape") show(false);
  });
}

/* ---------- start ---------- */
DATA.views.forEach(makeView);
if (DATA.views.length > 1) shared.camDist = 34;
/* a consult sphere opens with the situation tilted toward you, and its slow spin turns about the situation */
const spinAxis = DATA.center ? V(...DATA.center.pos).normalize() : null;
if (DATA.center) shared.q.setFromUnitVectors(spinAxis, V(0, 0.3, 0.95).normalize());
$("hint").textContent = "drag turns · wheel zooms · hover a saying for its full text · click for more · C controls · O solid" + (DATA.views.length > 1 ? " · both globes turn together" : "");
buildPanel();
/* links can open the panel (#controls) or apply a preset (#preset=Tensions) */
{
  const h = decodeURIComponent(location.hash);
  const p = (h.match(/preset=([A-Za-z]+)/) || [])[1];
  if (p && PRESETS[p]) look = withOverrides(defaultLook(), PRESETS[p]);
  if (h.includes("controls")) rollCtl(true);
}
applyLook();
function resize() { for (const v of views) { const w = v.canvas.clientWidth, h = v.canvas.clientHeight; v.renderer.setSize(w, h, false); v.camera.aspect = w / h; v.camera.updateProjectionMatrix(); } }
addEventListener("resize", resize); resize();
function tick() {
  requestAnimationFrame(tick);
  if (shared.targetQ) { shared.q.slerp(shared.targetQ, reduce ? 1 : 0.08); if (shared.q.angleTo(shared.targetQ) < 0.002) shared.targetQ = null; }
  else if (shared.spin) {
    if (spinAxis) shared.q.multiply(new THREE.Quaternion().setFromAxisAngle(spinAxis, 0.002));
    else shared.q.premultiply(new THREE.Quaternion().setFromAxisAngle(V(0, 1, 0), 0.0015));
  }
  for (const v of views) {
    v.camera.position.set(0, 0, shared.camDist); v.camera.lookAt(0, 0, 0);
    v.world.quaternion.copy(shared.q);
    v.renderer.render(v.scene, v.camera); renderLabels(v); renderTip(v);
  }
}
tick();
</script>
