<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sayings sphere</title>
<!-- Drawing approach follows the Network Meaning sphere (D:\Projects\network-meaning\public\sphere.html):
     Three.js r128, a world group turned by dragging, instanced marbles for the frequency-10 lattice,
     HTML labels projected each frame and dimmed on the far side, the same palette. -->
<style>
  :root {
    --ground: #0e1116; --panel: #161b22e8; --line: #2a313b; --ink: #e6e1d6; --dim: #8b919a;
    --env: #5fc4b8; --mind: #e59a7a; --moral: #e8c35c; --said: #9db7e8; --load: #ff7a59; --bond: #b9a3f0;
    --body: system-ui, -apple-system, "Segoe UI", sans-serif; --display: Georgia, "Times New Roman", serif;
  }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); font: 14px/1.45 var(--body); overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #c.drag { cursor: grabbing; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .lbl { position: absolute; transform: translate(-50%, -150%); font: 11px var(--body); white-space: nowrap; color: var(--ink);
         text-shadow: 0 0 4px var(--ground), 0 0 2px var(--ground); max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  .lbl.back { opacity: .25; }
  .lbl.sel { font-weight: 600; color: #fff; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  #head { top: 12px; left: 12px; max-width: 330px; }
  #head h1 { font: italic 20px var(--display); margin: 0 0 4px; }
  #head .meta { color: var(--dim); font-size: 12px; }
  #legend { margin-top: 8px; font-size: 12px; color: var(--dim); }
  #legend span.sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin: 0 4px 0 10px; vertical-align: 0; }
  #legend span.sw:first-child { margin-left: 0; }
  #info { top: 12px; right: 12px; width: 360px; max-height: calc(100% - 60px); overflow: auto; }
  #info[hidden] { display: none; }
  #info h2 { font: italic 18px var(--display); margin: 0 0 6px; line-height: 1.3; }
  #info .who { color: var(--dim); font-size: 12px; margin-bottom: 8px; }
  #info .lens { margin: 8px 0; }
  #info .tags { color: var(--dim); font-size: 12px; }
  #info h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 12px 0 4px; }
  #info ul { margin: 0; padding-left: 18px; }
  #info li { margin: 2px 0; cursor: pointer; }
  #info li:hover { color: #fff; }
  #info .counter { color: var(--load); }
  #hint { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div class="panel" id="head">
  <h1>Sayings sphere</h1>
  <div class="meta" id="meta"></div>
  <div id="legend"></div>
</div>
<div class="panel" id="info" hidden></div>
<div id="hint">drag turns · wheel zooms · click a saying · orange dashes join counter-sayings</div>
<script>/*__THREE__*/</script>
<script>
const DATA = /*__DATA__*/;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL = { ink: css("--ink"), dim: "#4a515b", ground: css("--ground"), load: css("--load"),
  apophthegm: css("--env"), aphorism: css("--said"), maxim: css("--moral"), proverb: css("--mind"), epigram: css("--bond") };
const R = 10, $ = id => document.getElementById(id), V = (x, y, z) => new THREE.Vector3(x, y, z);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const canvas = $("c"), labelsEl = $("labels"), info = $("info");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(COL.ground);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200), world = new THREE.Group();
scene.add(world);
let camDist = 30;

/* head panel */
const run = DATA.run;
$("meta").textContent = `Run ${run.id} · stage: ${run.stage} · ${run.sample.length} sayings · seed ${run.seed}` +
  (run.params.snap ? " · on the frequency-10 lattice" : "");
$("legend").innerHTML = ["apophthegm", "aphorism", "maxim", "proverb", "epigram"]
  .filter(f => DATA.sayings.some(s => s.form === f))
  .map(f => `<span class="sw" style="background:${COL[f]}"></span>${f}`).join("");

/* the globe and its 1,002 marbles, faint, as in Network Meaning's marble frame */
world.add(new THREE.Mesh(new THREE.SphereGeometry(R * 0.985, 48, 32),
  /* depthWrite off: the globe dims what is behind it but never hides the counter chords inside it */
  new THREE.MeshBasicMaterial({ color: 0x161b22, transparent: true, opacity: 0.55, depthWrite: false })));
{
  const geo = new THREE.SphereGeometry(0.06, 6, 4), mesh = new THREE.InstancedMesh(geo,
    new THREE.MeshBasicMaterial({ color: COL.dim, transparent: true, opacity: 0.5 }), DATA.lattice.length), m4 = new THREE.Matrix4();
  DATA.lattice.forEach(([x, y, z], i) => { m4.makeTranslation(x * R, y * R, z * R); mesh.setMatrixAt(i, m4); });
  world.add(mesh);
}

/* sayings */
const byId = {}; DATA.sayings.forEach(s => byId[s.id] = s);
const pos = {}, dots = [];
for (const p of DATA.points) {
  const v = (p.vertex != null ? V(...DATA.lattice[p.vertex]) : V(p.x, p.y, p.z)).normalize().multiplyScalar(R);
  pos[p.saying_id] = v;
  const s = byId[p.saying_id], size = 0.22 + 0.03 * s.impact_score;
  const dot = new THREE.Mesh(new THREE.SphereGeometry(size, 16, 12), new THREE.MeshBasicMaterial({ color: COL[s.form] || COL.ink }));
  dot.position.copy(v.clone().multiplyScalar(1 + size / R)); /* sit on the surface, not half inside it */
  dot.userData.id = s.id; world.add(dot); dots.push(dot);
}

/* triangulation edges as great-circle arcs just above the surface; brighter when the pair is related */
const arc = (a, b, lift) => { const pts = []; for (let i = 0; i <= 24; i++) { const t = i / 24, q = new THREE.Vector3().copy(a).normalize().lerp(b.clone().normalize(), t).normalize(); pts.push(q.multiplyScalar(R * lift)); } return pts; };
const edgeLines = [];
for (const [a, b, r] of DATA.edges) {
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(arc(pos[a], pos[b], 1.004)),
    new THREE.LineBasicMaterial({ color: COL.ink, transparent: true, opacity: 0.12 + 0.6 * r }));
  line.userData = { a, b, base: 0.12 + 0.6 * r }; world.add(line); edgeLines.push(line);
}
/* counter-sayings: a dashed chord straight through the globe */
for (const [a, b] of DATA.counters) {
  if (!pos[a] || !pos[b]) continue;
  const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints([pos[a], pos[b]]),
    new THREE.LineDashedMaterial({ color: COL.load, dashSize: 0.4, gapSize: 0.3, transparent: true, opacity: 0.7 }));
  l.computeLineDistances(); world.add(l);
}

/* labels, projected each frame (Network Meaning's renderLabels) */
const short = t => t.length > 42 ? t.slice(0, 40).replace(/\s+\S*$/, "") + "…" : t;
let selected = null;
function renderLabels() {
  labelsEl.textContent = "";
  const w = canvas.clientWidth, h = canvas.clientHeight, camPos = camera.position.clone();
  for (const s of DATA.sayings) {
    if (!pos[s.id]) continue;
    const wp = pos[s.id].clone().applyMatrix4(world.matrixWorld), sp = wp.clone().project(camera);
    if (sp.z > 1 || Math.abs(sp.x) > 1.05 || Math.abs(sp.y) > 1.05) continue;
    const el = document.createElement("div");
    el.className = "lbl" + (s.id === selected ? " sel" : "");
    el.textContent = short(s.text);
    el.style.left = ((sp.x + 1) / 2 * w) + "px"; el.style.top = ((1 - sp.y) / 2 * h) + "px";
    if (wp.distanceTo(camPos) > camPos.length()) el.classList.add("back");
    labelsEl.appendChild(el);
  }
}

/* info panel */
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const item = (id, cls) => `<li class="${cls || ""}" data-id="${id}">${esc(byId[id].text)}</li>`;
function select(id) {
  selected = id;
  for (const l of edgeLines) l.material.opacity = id == null ? l.userData.base : (l.userData.a === id || l.userData.b === id ? 0.95 : l.userData.base * 0.35);
  if (id == null) { info.hidden = true; return; }
  const s = byId[id];
  const near = DATA.edges.filter(([a, b]) => a === id || b === id).map(([a, b, r]) => [a === id ? b : a, r]).sort((x, y) => y[1] - x[1]);
  const opp = DATA.counters.filter(([a, b]) => a === id || b === id).map(([a, b]) => a === id ? b : a).filter(x => byId[x]);
  info.innerHTML = `<h2>${esc(s.text)}</h2><div class="who">#${s.id} · ${esc(s.who)} · ${s.form} · impact ${s.impact_score}</div>` +
    `<div class="lens">${esc(s.lens)}</div><div class="tags">${esc(s.tags.join(", "))}</div>` +
    (near.length ? `<h3>Neighbours on the sphere</h3><ul>${near.map(([n, r]) => item(n) .replace("</li>", r ? ` <span class="tags">(${Math.round(r * 100)}% shared tags)</span></li>` : "</li>")).join("")}</ul>` : "") +
    (opp.length ? `<h3>Pulls the other way</h3><ul>${opp.map(n => item(n, "counter")).join("")}</ul>` : "");
  info.hidden = false;
  info.querySelectorAll("li[data-id]").forEach(li => li.onclick = () => { const n = +li.dataset.id; select(n); turnTo(n); });
}
let targetQ = null;
function turnTo(id) { /* bring a saying round to face the camera */
  const from = pos[id].clone().normalize(), q = new THREE.Quaternion().setFromUnitVectors(from, V(0, 0, 1)); targetQ = q; spin = false;
}

/* turning and zooming (Network Meaning's pointer handling, simplified) */
let dragging = false, moved = 0, last = [0, 0], spin = !reduce;
canvas.addEventListener("pointerdown", e => { dragging = true; moved = 0; last = [e.clientX, e.clientY]; canvas.setPointerCapture(e.pointerId); canvas.classList.add("drag"); });
canvas.addEventListener("pointermove", e => {
  if (!dragging) return;
  const dx = e.clientX - last[0], dy = e.clientY - last[1]; last = [e.clientX, e.clientY]; moved += Math.abs(dx) + Math.abs(dy);
  targetQ = null;
  world.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(V(0, 1, 0), dx * 0.008)).premultiply(new THREE.Quaternion().setFromAxisAngle(V(1, 0, 0), dy * 0.008));
  if (moved > 4) spin = false;
});
const ray = new THREE.Raycaster();
canvas.addEventListener("pointerup", e => {
  dragging = false; canvas.classList.remove("drag");
  if (moved > 4) return;
  const r = canvas.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1), camera);
  const hit = ray.intersectObjects(dots)[0];
  select(hit ? hit.object.userData.id : null);
});
canvas.addEventListener("wheel", e => { e.preventDefault(); camDist = Math.min(70, Math.max(13, camDist * (1 + Math.sign(e.deltaY) * 0.08))); }, { passive: false });

function resize() { const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
function tick() {
  requestAnimationFrame(tick);
  camera.position.set(0, 0, camDist); camera.lookAt(0, 0, 0);
  if (targetQ) { world.quaternion.slerp(targetQ, reduce ? 1 : 0.08); if (world.quaternion.angleTo(targetQ) < 0.002) targetQ = null; }
  else if (spin) world.rotation.y += 0.0015;
  renderer.render(scene, camera); renderLabels();
}
tick();
</script>
</body>
</html>
